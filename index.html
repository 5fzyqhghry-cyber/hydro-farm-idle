<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hydro Farm Idle</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f0c29;
      --text: #ffffff;
      --button: #e94560;
      --gold: #FFD700;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: #0a0a1a;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
      display: flex;
      justify-content: center;
    }

    #game {
      width: 100%;
      max-width: 430px;
      height: 100%;
      background: linear-gradient(to bottom, #0f0c29 0%, #302b63 45%, #24243e 100%);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Верхняя панель */
    #top-bar {
      padding: 12px 14px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }

    .coins {
      font-size: 22px;
      font-weight: 800;
      color: var(--gold);
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* Зона доставки */
    #delivery-zone {
      height: 115px;
      position: relative;
      overflow: hidden;
      border-bottom: 3px solid #2a2a4a;
    }

    .city-bg {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 75px;
      background: linear-gradient(to top, #1a1a2e 30%, transparent),
                  repeating-linear-gradient(90deg, #1f1f3a 0px, #1f1f3a 16px, #16162b 16px, #16162b 38px);
      opacity: 0.75;
    }

    .building {
      position: absolute;
      bottom: 10px;
      width: 68px;
      height: 52px;
      background: #3a3a5c;
      border-radius: 6px 6px 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 5px;
      font-size: 11px;
      font-weight: 700;
      box-shadow: 0 0 0 2px #2a2a4a;
    }
    .building.left { left: 6px; }
    .building.right { right: 6px; }
    .building .label {
      background: #4a4a6a;
      padding: 2px 6px;
      border-radius: 4px;
      margin-bottom: 3px;
    }

    /* Скутеры */
    .scooter {
      position: absolute;
      bottom: 14px;
      font-size: 38px;
      filter: drop-shadow(0 3px 3px rgba(0,0,0,0.45));
      z-index: 5;
      transition: left 0.05s linear;
    }
    .scooter-load {
      position: absolute;
      top: -8px;
      right: -4px;
      background: #4CAF50;
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 8px;
      border: 1px solid #fff;
    }

    /* Основная зона */
    #main-area {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Лифт */
    #elevator-zone {
      width: 76px;
      background: #12121f;
      border-right: 3px solid #2a2a4a;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 4px;
      flex-shrink: 0;
    }

    .elev-info {
      text-align: center;
      font-size: 11px;
      margin-bottom: 6px;
      line-height: 1.35;
    }

    #elevator-shaft {
      flex: 1;
      width: 52px;
      background: #0d0d18;
      border: 2px solid #333;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      margin-bottom: 8px;
    }

    #elevator-cabin {
      position: absolute;
      left: 3px;
      width: 42px;
      height: 46px;
      background: linear-gradient(to bottom, #5c6bc0, #3949ab);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: top 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      border: 2px solid #9fa8da;
    }
    #elevator-cabin .load {
      font-size: 10px;
      font-weight: 700;
      background: rgba(0,0,0,0.35);
      padding: 1px 5px;
      border-radius: 6px;
      margin-top: 1px;
    }

    .elev-btn {
      width: 100%;
      padding: 8px 2px;
      border: none;
      border-radius: 8px;
      background: var(--button);
      color: white;
      font-weight: 700;
      font-size: 11px;
    }

    /* Этажи */
    #floors {
      flex: 1;
      display: flex;
      flex-direction: column-reverse;
      padding: 8px 8px 8px 6px;
      gap: 8px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .floor {
      background: rgba(20, 20, 35, 0.88);
      border-radius: 14px;
      padding: 10px;
      border: 1px solid rgba(255,255,255,0.08);
      min-height: 108px;
    }

    .floor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }
    .floor-name { font-size: 14px; font-weight: 700; }
    .floor-level {
      background: linear-gradient(135deg, #e94560, #c81e4a);
      padding: 3px 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
    }

    .floor-stats {
      font-size: 11px;
      opacity: 0.75;
      margin-bottom: 5px;
    }

    .plants-row {
      display: flex;
      gap: 5px;
      height: 46px;
      align-items: flex-end;
      margin-bottom: 7px;
      overflow: hidden;
    }

    .plant {
      width: 34px;
      height: 40px;
      position: relative;
      flex-shrink: 0;
    }
    .plant-pot {
      position: absolute;
      bottom: 0;
      left: 5px;
      width: 24px;
      height: 13px;
      background: #8d6e63;
      border-radius: 2px 2px 4px 4px;
      border: 1px solid #5d4037;
    }
    .plant-body {
      position: absolute;
      bottom: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 26px;
      height: 26px;
      border-radius: 50% 50% 45% 45%;
      box-shadow: inset -3px -3px 0 rgba(0,0,0,0.18);
    }
    .plant-body.green  { background: radial-gradient(circle at 30% 30%, #81c784, #2e7d32); }
    .plant-body.purple { background: radial-gradient(circle at 30% 30%, #ce93d8, #6a1b9a); }
    .plant-body.pink   { background: radial-gradient(circle at 30% 30%, #f48fb1, #c2185b); }

    .drone {
      position: absolute;
      font-size: 13px;
      animation: droneFly 2.8s ease-in-out infinite;
      z-index: 4;
    }
    @keyframes droneFly {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(6px, -9px); }
    }

    .box-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .box {
      flex: 1;
      height: 11px;
      background: rgba(0,0,0,0.4);
      border-radius: 6px;
      overflow: hidden;
    }
    .box-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 0.3s;
    }

    .floor button {
      padding: 7px 10px;
      border: none;
      border-radius: 8px;
      background: var(--button);
      color: white;
      font-weight: 700;
      font-size: 12px;
      white-space: nowrap;
    }

    /* Оффлайн */
    #offline-popup {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    #offline-popup.show { display: flex; }
    .popup-content {
      background: #1a1a2e;
      padding: 28px 22px;
      border-radius: 18px;
      text-align: center;
      width: 100%;
      max-width: 290px;
    }
    .popup-content h2 { color: var(--gold); margin-bottom: 8px; }
    .popup-content button {
      margin-top: 16px;
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: var(--button);
      color: white;
      font-size: 16px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="game">
    <div id="top-bar">
      <div class="coins">💰 <span id="coins">0</span></div>
    </div>

    <div id="delivery-zone">
      <div class="city-bg"></div>

      <div class="building left">
        <div class="label">Склад</div>
        <div id="warehouse-amount">0</div>
      </div>
      <div class="building right" id="courier-upgrade">
        <div class="label">Курьеры</div>
        <div>Lv.<span id="courier-level">1</span></div>
      </div>

      <div class="scooter" id="scooter1">🛵<div class="scooter-load" id="load1">0</div></div>
      <div class="scooter" id="scooter2">🛵<div class="scooter-load" id="load2">0</div></div>
    </div>

    <div id="main-area">
      <aside id="elevator-zone">
        <div class="elev-info">
          🛗<br>Lv.<span id="elev-level">1</span><br>
          <span id="elev-load">0/30</span>
        </div>
        <div id="elevator-shaft">
          <div id="elevator-cabin">
            🧑‍🔧
            <div class="load" id="cabin-load">0</div>
          </div>
        </div>
        <button class="elev-btn" id="upgrade-elev">Апгрейд<br><span id="elev-cost">120</span></button>
      </aside>

      <main id="floors">
        <div class="floor" id="floor-1">
          <div class="floor-header">
            <div class="floor-name">🌿 Green Kush</div>
            <div class="floor-level">⬆ <span class="lvl">1</span></div>
          </div>
          <div class="floor-stats">Коробка: <span class="box-count">0</span>/<span class="box-cap">20</span></div>
          <div class="plants-row" id="plants-1"></div>
          <div class="box-row">
            <div class="box"><div class="box-fill" style="background:#4CAF50"></div></div>
            <button data-floor="1">Апгрейд <span class="cost">50</span></button>
          </div>
        </div>

        <div class="floor" id="floor-2">
          <div class="floor-header">
            <div class="floor-name">🍇 Purple Haze</div>
            <div class="floor-level">⬆ <span class="lvl">1</span></div>
          </div>
          <div class="floor-stats">Коробка: <span class="box-count">0</span>/<span class="box-cap">20</span></div>
          <div class="plants-row" id="plants-2"></div>
          <div class="box-row">
            <div class="box"><div class="box-fill" style="background:#9C27B0"></div></div>
            <button data-floor="2">Апгрейд <span class="cost">50</span></button>
          </div>
        </div>

        <div class="floor" id="floor-3">
          <div class="floor-header">
            <div class="floor-name">🍬 Bubblegum</div>
            <div class="floor-level">⬆ <span class="lvl">1</span></div>
          </div>
          <div class="floor-stats">Коробка: <span class="box-count">0</span>/<span class="box-cap">20</span></div>
          <div class="plants-row" id="plants-3"></div>
          <div class="box-row">
            <div class="box"><div class="box-fill" style="background:#E91E63"></div></div>
            <button data-floor="3">Апгрейд <span class="cost">50</span></button>
          </div>
        </div>
      </main>
    </div>

    <div id="offline-popup">
      <div class="popup-content">
        <h2>Пока вас не было</h2>
        <p>Курьеры привезли</p>
        <p style="font-size:32px;color:var(--gold);margin:10px 0;font-weight:800" id="offline-coins">0</p>
        <p>монет</p>
        <button id="collect-offline">Забрать</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    function haptic(type = 'light') {
      if (tg?.HapticFeedback) {
        if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
        else if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
        else tg.HapticFeedback.impactOccurred('light');
      }
    }

    const player = { coins: 0, lastSaveTime: Date.now() };
    const warehouse = {
      amount: 0, capacity: 500,
      add(q) { this.amount = Math.min(this.amount + q, this.capacity); },
      remove(q) { const t = Math.min(q, this.amount); this.amount -= t; return t; }
    };

    const floors = [
      { id: 1, color: "green",  level: 1, baseGrow: 2.5, boxCap: 20, current: 0 },
      { id: 2, color: "purple", level: 1, baseGrow: 3.4, boxCap: 20, current: 0 },
      { id: 3, color: "pink",   level: 1, baseGrow: 4.6, boxCap: 20, current: 0 }
    ];

    const elevator = {
      level: 1, capacity: 28, currentLoad: 0,
      position: 0, state: "idle", lastAction: Date.now(), targetFloor: 3
    };

    const couriers = { level: 1, count: 2, capacityPer: 11, speed: 3.1, lastDelivery: Date.now() };

    // Скутеры
    const scooters = [
      { el: null, x: 85, dir: 1, speed: 0.55 },
      { el: null, x: 200, dir: -1, speed: 0.42 }
    ];

    const floorGrowTime = f => f.baseGrow / (1 + (f.level - 1) * 0.23);
    const floorUpgradeCost = f => Math.floor(42 * Math.pow(1.51, f.level - 1));
    const elevCapacity = () => Math.floor(elevator.capacity * (1 + (elevator.level - 1) * 0.33));
    const elevUpgradeCost = () => Math.floor(105 * Math.pow(1.67, elevator.level - 1));
    const elevMoveTime = () => 1.5 / (1 + (elevator.level - 1) * 0.19);
    const courierCapacity = () => couriers.count * couriers.capacityPer * (1 + (couriers.level - 1) * 0.2);
    const courierInterval = () => couriers.speed / (1 + (couriers.level - 1) * 0.15);
    const courierUpgradeCost = () => Math.floor(170 * Math.pow(1.61, couriers.level - 1));

    function produce(delta) {
      floors.forEach(f => {
        const can = Math.floor(delta / floorGrowTime(f));
        if (can > 0) f.current = Math.min(f.current + can, f.boxCap);
      });
    }

    function updateElevator(now) {
      const t = elevMoveTime() * 1000;
      if (elevator.state === "idle") {
        if (floors.some(f => f.current > 0) || elevator.currentLoad > 0) {
          elevator.state = "down";
          elevator.targetFloor = 3;
          elevator.lastAction = now;
        }
        return;
      }
      if (elevator.state === "down" && now - elevator.lastAction >= t) {
        const f = floors.find(fl => fl.id === elevator.targetFloor);
        if (f) {
          const take = Math.min(elevCapacity() - elevator.currentLoad, f.current);
          f.current -= take;
          elevator.currentLoad += take;
        }
        elevator.targetFloor--;
        elevator.lastAction = now;
        if (elevator.targetFloor < 1) {
          elevator.state = "up";
          elevator.targetFloor = 0;
        }
      }
      if (elevator.state === "up" && now - elevator.lastAction >= t * 1.2) {
        warehouse.add(elevator.currentLoad);
        elevator.currentLoad = 0;
        elevator.state = "idle";
        elevator.lastAction = now;
      }
      elevator.position = elevator.state === "down" ? (4 - elevator.targetFloor) : 0;
    }

    function updateCouriers(now) {
      const interval = courierInterval() * 1000;
      if (now - couriers.lastDelivery < interval) return;
      const trips = Math.floor((now - couriers.lastDelivery) / interval);
      for (let i = 0; i < trips; i++) {
        const take = Math.min(courierCapacity(), warehouse.amount);
        if (take <= 0) break;
        warehouse.remove(take);
        player.coins += take * 7.8;
      }
      couriers.lastDelivery = now;
    }

    function animateScooters() {
      const w = document.getElementById("delivery-zone").clientWidth;
      scooters.forEach(s => {
        s.x += s.speed * s.dir;
        if (s.x > w - 85) s.dir = -1;
        if (s.x < 75) s.dir = 1;
        if (s.el) s.el.style.left = s.x + "px";
      });
    }

    function save() {
      localStorage.setItem("hydroFarmSave", JSON.stringify({
        coins: player.coins,
        lastSaveTime: Date.now(),
        warehouse: warehouse.amount,
        floors: floors.map(f => ({ level: f.level, current: f.current, boxCap: f.boxCap })),
        elevator: { level: elevator.level },
        couriers: { level: couriers.level, count: couriers.count }
      }));
    }

    function load() {
      try {
        const d = JSON.parse(localStorage.getItem("hydroFarmSave"));
        if (!d) return;
        player.coins = d.coins || 0;
        player.lastSaveTime = d.lastSaveTime || Date.now();
        warehouse.amount = d.warehouse || 0;
        if (d.floors) d.floors.forEach((s, i) => {
          floors[i].level = s.level || 1;
          floors[i].current = s.current || 0;
          floors[i].boxCap = s.boxCap || 20;
        });
        if (d.elevator) elevator.level = d.elevator.level || 1;
        if (d.couriers) {
          couriers.level = d.couriers.level || 1;
          couriers.count = d.couriers.count || 2;
        }
      } catch(e) {}
    }

    function calculateOffline() {
      const sec = Math.min((Date.now() - player.lastSaveTime) / 1000, 8 * 3600);
      if (sec < 25) return 0;
      let prod = 0;
      floors.forEach(f => prod += Math.floor(sec / floorGrowTime(f) * 0.6));
      const del = Math.min(prod, (sec / courierInterval()) * courierCapacity());
      return Math.floor(del * 7.8 * 0.65);
    }

    function renderPlants(f) {
      const row = document.getElementById(`plants-${f.id}`);
      const maxShow = 7;
      const count = Math.min(maxShow, Math.ceil((f.current / f.boxCap) * maxShow) + (f.current > 0 ? 1 : 0));
      if (row.children.length === count) return;
      row.innerHTML = "";
      for (let i = 0; i < count; i++) {
        const p = document.createElement("div");
        p.className = "plant";
        p.innerHTML = `<div class="plant-body ${f.color}"></div><div class="plant-pot"></div>`;
        if (Math.random() > 0.55) {
          const d = document.createElement("div");
          d.className = "drone";
          d.textContent = "🛸";
          d.style.left = (6 + Math.random()*14) + "px";
          d.style.top = (-8 - Math.random()*6) + "px";
          d.style.animationDelay = (Math.random()*2) + "s";
          p.appendChild(d);
        }
        row.appendChild(p);
      }
    }

    function render() {
      document.getElementById("coins").textContent = Math.floor(player.coins).toLocaleString("ru");
      document.getElementById("warehouse-amount").textContent = Math.floor(warehouse.amount);
      document.getElementById("courier-level").textContent = couriers.level;
      document.getElementById("elev-level").textContent = elevator.level;
      document.getElementById("elev-load").textContent = `${elevator.currentLoad}/${elevCapacity()}`;
      document.getElementById("elev-cost").textContent = elevUpgradeCost();
      document.getElementById("cabin-load").textContent = elevator.currentLoad;

      const cabin = document.getElementById("elevator-cabin");
      const h = document.getElementById("elevator-shaft").clientHeight;
      cabin.style.top = ((elevator.position / 3) * (h - 50)) + "px";

      floors.forEach(f => {
        const el = document.getElementById(`floor-${f.id}`);
        el.querySelector(".lvl").textContent = f.level;
        el.querySelector(".box-count").textContent = Math.floor(f.current);
        el.querySelector(".box-cap").textContent = f.boxCap;
        el.querySelector(".box-fill").style.width = (f.current / f.boxCap * 100) + "%";
        el.querySelector(".cost").textContent = floorUpgradeCost(f);
        renderPlants(f);
      });

      document.getElementById("load1").textContent = warehouse.amount > 5 ? Math.floor(Math.random()*9+2) : 0;
      document.getElementById("load2").textContent = warehouse.amount > 5 ? Math.floor(Math.random()*7+1) : 0;
    }

    // Кнопки
    document.getElementById("upgrade-elev").onclick = () => {
      const c = elevUpgradeCost();
      if (player.coins >= c) {
        player.coins -= c; elevator.level++;
        haptic("success"); save(); render();
      } else haptic("error");
    };

    document.getElementById("courier-upgrade").onclick = () => {
      const c = courierUpgradeCost();
      if (player.coins >= c) {
        player.coins -= c; couriers.level++;
        if (couriers.level % 2 === 0) couriers.count++;
        haptic("success"); save(); render();
      } else haptic("error");
    };

    document.querySelectorAll("[data-floor]").forEach(btn => {
      btn.onclick = () => {
        const f = floors.find(fl => fl.id === +btn.dataset.floor);
        const c = floorUpgradeCost(f);
        if (player.coins >= c) {
          player.coins -= c; f.level++;
          f.boxCap = Math.floor(20 * (1 + f.level * 0.27));
          haptic("success"); save(); render();
        } else haptic("error");
      };
    });

    document.getElementById("collect-offline").onclick = () => {
      document.getElementById("offline-popup").classList.remove("show");
      haptic("success");
    };

    // Старт
    scooters[0].el = document.getElementById("scooter1");
    scooters[1].el = document.getElementById("scooter2");

    load();
    const offline = calculateOffline();
    if (offline > 0) {
      player.coins += offline;
      document.getElementById("offline-coins").textContent = offline.toLocaleString("ru");
      document.getElementById("offline-popup").classList.add("show");
    }
    player.lastSaveTime = Date.now();
    save();

    let last = Date.now();
    function loop(now) {
      const delta = (now - last) / 1000;
      last = now;
      produce(delta);
      updateElevator(now);
      updateCouriers(now);
      animateScooters();
      render();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    setInterval(save, 15000);
  </script>
</body>
</html>
