<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hydro Farm Idle</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #1a1a2e);
      --text: var(--tg-theme-text-color, #e8e8e8);
      --hint: var(--tg-theme-hint-color, #999);
      --button: var(--tg-theme-button-color, #e94560);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --secondary: var(--tg-theme-secondary-bg-color, #16213e);
      --header: var(--tg-theme-header-bg-color, #0f3460);
      --accent: var(--tg-theme-accent-text-color, #0f3460);
      --gold: #FFD700;
      --green: #4CAF50;
      --purple: #9C27B0;
      --pink: #E91E63;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
      display: flex;
      justify-content: center;
    }

    #game {
      width: 100%;
      max-width: 420px;
      height: 100%;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ===== ВЕРХНЯЯ ЗОНА ===== */
    #top-zone {
      background: var(--secondary);
      padding: 14px 14px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
    }

    .coins {
      font-size: 24px;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-row {
      display: flex;
      gap: 10px;
      font-size: 13px;
    }

    .warehouse, .couriers {
      background: var(--bg);
      padding: 10px;
      border-radius: 12px;
      flex: 1;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .couriers button, .elev-btn, .floor button {
      margin-top: 8px;
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 10px;
      background: var(--button);
      color: var(--button-text);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .couriers button:active, .elev-btn:active, .floor button:active {
      transform: scale(0.96);
      opacity: 0.9;
    }

    /* ===== ОСНОВНАЯ ОБЛАСТЬ ===== */
    #main-area {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ===== ЛИФТ ===== */
    #elevator-zone {
      width: 92px;
      background: rgba(0,0,0,0.25);
      border-right: 1px solid rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 6px;
      flex-shrink: 0;
    }

    .elev-info {
      text-align: center;
      font-size: 12px;
      margin-bottom: 8px;
      line-height: 1.45;
    }

    #elevator-shaft {
      flex: 1;
      width: 48px;
      background: rgba(0,0,0,0.3);
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      margin-bottom: 10px;
    }

    #elevator-cabin {
      position: absolute;
      left: 4px;
      width: 36px;
      height: 30px;
      background: linear-gradient(to bottom, #4fc3f7, #0288d1);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      color: #fff;
      transition: top 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 3px 8px rgba(0,0,0,0.4);
    }

    .elev-btn {
      font-size: 12px;
      padding: 9px 4px;
    }

    /* ===== ЭТАЖИ ===== */
    #floors {
      flex: 1;
      display: flex;
      flex-direction: column-reverse;
      padding: 10px;
      gap: 10px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .floor {
      background: var(--secondary);
      border-radius: 14px;
      padding: 12px;
      border-left: 5px solid var(--color);
      position: relative;
    }

    .floor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 15px;
      font-weight: 600;
    }

    .level {
      background: rgba(255,255,255,0.1);
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 12px;
    }

    .plants {
      display: flex;
      gap: 5px;
      margin-bottom: 7px;
      height: 22px;
    }

    .plant {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--color);
      opacity: 0.9;
    }

    .box-label {
      font-size: 12px;
      opacity: 0.75;
      margin-bottom: 4px;
    }

    .box {
      height: 14px;
      background: rgba(0,0,0,0.35);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .box-fill {
      height: 100%;
      background: var(--color);
      width: 0%;
      transition: width 0.35s;
      border-radius: 8px;
    }

    /* Оффлайн попап */
    #offline-popup {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.78);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    #offline-popup.show {
      display: flex;
    }

    .popup-content {
      background: var(--secondary);
      padding: 28px 24px;
      border-radius: 18px;
      text-align: center;
      width: 100%;
      max-width: 300px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }

    .popup-content h2 {
      margin-bottom: 10px;
      color: var(--gold);
      font-size: 20px;
    }

    .popup-content button {
      margin-top: 18px;
      padding: 12px 28px;
      border: none;
      border-radius: 12px;
      background: var(--button);
      color: var(--button-text);
      font-size: 16px;
      font-weight: 600;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="game">
    <!-- Верх -->
    <header id="top-zone">
      <div class="coins">💰 <span id="coins">0</span></div>
      <div class="top-row">
        <div class="warehouse">
          📦 Склад<br>
          <strong id="warehouse-amount">0</strong> / 500
        </div>
        <div class="couriers">
          🛵 Курьеры: <span id="courier-count">1</span><br>
          Lv.<span id="courier-level">1</span>
          <button id="upgrade-courier">Апгрейд (<span id="="courier-cost">200</span>)</button>
        </div>
      </div>
    </header>

    <div id="main-area">
      <!-- Лифт -->
      <aside id="elevator-zone">
        <div class="elev-info">
          🛗 Лифт<br>
          Lv.<span id="elev-level">1</span><br>
          <span id="elev-load">0/30</span>
        </div>
        <div id="elevator-shaft">
          <div id="elevator-cabin">0</div>
        </div>
        <button class="elev-btn" id="upgrade-elev">Апгрейд<br>(<span id="elev-cost">120</span>)</button>
      </aside>

      <!-- Этажи -->
      <main id="floors">
        <div class="floor" id="floor-1" style="--color: #4CAF50">
          <div class="floor-header">
            <span>🌿 Green Kush</span>
            <span class="level">Lv.<span class="lvl">1</span></span>
          </div>
          <div class="plants" id="plants-1"></div>
          <div class="box-label">Коробка: <span class="box-count">0</span>/20</div>
          <div class="box"><div class="box-fill"></div></div>
          <button data-floor="1">Апгрейд (<span class="cost">50</span>)</button>
        </div>

        <div class="floor" id="floor-2" style="--color: #9C27B0">
          <div class="floor-header">
            <span>🍇 Purple Haze</span>
            <span class="level">Lv.<span class="lvl">1</span></span>
          </div>
          <div class="plants" id="plants-2"></div>
          <div class="box-label">Коробка: <span class="box-count">0</span>/20</div>
          <div class="box"><div class="box-fill"></div></div>
          <button data-floor="2">Апгрейд (<span class="cost">50</span>)</button>
        </div>

        <div class="floor" id="floor-3" style="--color: #E91E63">
          <div class="floor-header">
            <span>🍬 Bubblegum</span>
            <span class="level">Lv.<span class="lvl">1</span></span>
          </div>
          <div class="plants" id="plants-3"></div>
          <div class="box-label">Коробка: <span class="box-count">0</span>/20</div>
          <div class="box"><div class="box-fill"></div></div>
          <button data-floor="3">Апгрейд (<span class="cost">50</span>)</button>
        </div>
      </main>
    </div>

    <!-- Оффлайн попап -->
    <div id="offline-popup">
      <div class="popup-content">
        <h2>Пока вас не было...</h2>
        <p>Курьеры заработали</p>
        <p style="font-size: 32px; color: var(--gold); margin: 12px 0; font-weight: 700;" id="offline-coins">0</p>
        <p>монет</p>
        <button id="collect-offline">Забрать</button>
      </div>
    </div>
  </div>

  <script>
    // ===================== TELEGRAM WEBAPP =====================
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      // Можно включить подтверждение закрытия
      // tg.enableClosingConfirmation();
      
      // Применяем тему
      document.documentElement.style.setProperty('--bg', tg.themeParams.bg_color || '#1a1a2e');
      document.documentElement.style.setProperty('--text', tg.themeParams.text_color || '#e8e8e8');
      document.documentElement.style.setProperty('--button', tg.themeParams.button_color || '#e94560');
      document.documentElement.style.setProperty('--button-text', tg.themeParams.button_text_color || '#ffffff');
      document.documentElement.style.setProperty('--secondary', tg.themeParams.secondary_bg_color || '#16213e');
    }

    // Вибрация
    function haptic(type = 'light') {
      if (tg?.HapticFeedback) {
        if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
        else if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
        else tg.HapticFeedback.impactOccurred('light');
      }
    }

    // ===================== ДАННЫЕ ИГРЫ =====================
    const player = {
      coins: 0,
      lastSaveTime: Date.now()
    };

    const warehouse = {
      amount: 0,
      capacity: 500,
      add(qty) {
        this.amount = Math.min(this.amount + qty, this.capacity);
      },
      remove(qty) {
        const taken = Math.min(qty, this.amount);
        this.amount -= taken;
        return taken;
      }
    };

    const floors = [
      { id: 1, name: "Green Kush", color: "#4CAF50", level: 1, baseValue: 5,  baseGrow: 2.8, boxCap: 20, current: 0 },
      { id: 2, name: "Purple Haze", color: "#9C27B0", level: 1, baseValue: 9,  baseGrow: 3.8, boxCap: 20, current: 0 },
      { id: 3, name: "Bubblegum",  color: "#E91E63", level: 1, baseValue: 15, baseGrow: 5.0, boxCap: 20, current: 0 }
    ];

    const elevator = {
      level: 1,
      capacity: 30,
      currentLoad: 0,
      position: 0,
      state: "idle",
      lastAction: Date.now(),
      targetFloor: 3
    };

    const couriers = {
      level: 1,
      count: 1,
      capacityPer: 12,
      speed: 3.5,
      lastDelivery: Date.now()
    };

    // ===================== ФОРМУЛЫ =====================
    function floorGrowTime(f) {
      return f.baseGrow / (1 + (f.level -  1) * 0.22);
    }
    function floorUnitValue(f) {
      return f.baseValue * (1 + (f.level - 1) * 0.35);
    }
    function floorUpgradeCost(f) {
      return Math.floor(45 * Math.pow(1.52, f.level - 1));
    }
    function elevCapacity() {
      return Math.floor(elevator.capacity * (1 + (elevator.level - 1) * 0.32));
    }
    function elevUpgradeCost() {
      return Math.floor(110 * Math.pow(1.68, elevator.level - 1));
    }
    function elevMoveTime() {
      return 1.6 / (1 + (elevator.level - 1) * 0.18);
    }
    function courierCapacity() {
      return couriers.count * couriers.capacityPer * (1 + (couriers.level - 1) * 0.22);
    }
    function courierInterval() {
      return couriers.speed / (1 + (couriers.level - 1) * 0.14);
    }
    function courierUpgradeCost() {
      return Math.floor(180 * Math.pow(1.62, couriers.level - 1));
    }

    // ===================== ЛОГИКА =====================
    function produce(delta) {
      floors.forEach(f => {
        const growTime = floorGrowTime(f);
        const canGrow = Math.floor(delta / growTime);
        if (canGrow <= 0) return;
        const free = f.boxCap - f.current;
        f.current += Math.min(canGrow, free);
      });
    }

    function updateElevator(now) {
      const moveTimeMs = elevMoveTime() * 1000;

      if (elevator.state === "idle") {
        const hasCargo = floors.some(f => f.current > 0);
        if (hasCargo || elevator.currentLoad > 0) {
          elevator.state = "down";
          elevator.targetFloor = 3;
          elevator.lastAction = now;
        }
        return;
      }

      if (elevator.state === "down") {
        if (now - elevator.lastAction >= moveTimeMs) {
          const f = floors.find(fl => fl.id === elevator.targetFloor);
          if (f) {
            const free = elevCapacity() - elevator.currentLoad;
            const taken = Math.min(free, f.current);
            f.current -= taken;
            elevator.currentLoad += taken;
          }
          elevator.targetFloor--;
          elevator.lastAction = now;
          if (elevator.targetFloor < 1) {
            elevator.state = "up";
            elevator.targetFloor = 0;
          }
        }
      }

      if (elevator.state === "up") {
        if (now - elevator.lastAction >= moveTimeMs * 1.25) {
          warehouse.add(elevator.currentLoad);
          elevator.currentLoad = 0;
          elevator.state = "idle";
          elevator.lastAction = now;
        }
      }

      if (elevator.state === "down") {
        elevator.position = 4 - elevator.targetFloor;
      } else {
        elevator.position = 0;
      }
    }

    function updateCouriers(now) {
      const interval = courierInterval() * 1000;
      const elapsed = now - couriers.lastDelivery;
      if (elapsed < interval) return;

      const trips = Math.floor(elapsed / interval);
      for (let i = 0; i < trips; i++) {
        const canTake = Math.min(courierCapacity(), warehouse.amount);
        if (canTake <= 0) break;
        warehouse.remove(canTake);
        player.coins += canTake * 7.5;
      }
      couriers.lastDelivery = now;
    }

    // ===================== ОФФЛАЙН =====================
    function calculateOffline() {
      const now = Date.now();
      const offlineSec = Math.min((now - player.lastSaveTime) / 1000, 8 * 3600);
      if (offlineSec < 20) return 0;

      let produced = 0;
      floors.forEach(f => {
        produced += Math.floor(offlineSec / floorGrowTime(f) * 0.65);
      });

      const possible = offlineSec / courierInterval();
      const delivered = Math.min(produced, possible * courierCapacity());
      return Math.floor(delivered * 7.5 * 0.7);
    }

    // ===================== СОХРАНЕНИЕ =====================
    function save() {
      const data = {
        coins: player.coins,
        lastSaveTime: Date.now(),
        warehouse: warehouse.amount,
        floors: floors.map(f => ({
          level: f.level,
          current: f.current,
          boxCap: f.boxCap
        })),
        elevator: { level: elevator.level },
        couriers: { level: couriers.level, count: couriers.count }
      };
      localStorage.setItem("hydroFarmSave", JSON.stringify(data));
    }

    function load() {
      const raw = localStorage.getItem("hydroFarmSave");
      if (!raw) return;
      try {
        const data = JSON.parse(raw);
        player.coins = data.coins || 0;
        player.lastSaveTime = data.lastSaveTime || Date.now();
        warehouse.amount = data.warehouse || 0;

        if (data.floors) {
          data.floors.forEach((saved, i) => {
            if (floors[i]) {
              floors[i].level = saved.level || 1;
              floors[i].current = saved.current || 0;
              floors[i].boxCap = saved.boxCap || 20;
            }
          });
        }
        if (data.elevator) elevator.level = data.elevator.level || 1;
        if (data.couriers) {
          couriers.level = data.couriers.level || 1;
          couriers.count = data.couriers.count || 1;
        }
      } catch (e) {}
    }

    // ===================== РЕНДЕР =====================
    function render() {
      document.getElementById("coins").textContent = Math.floor(player.coins).toLocaleString("ru");
      document.getElementById("warehouse-amount").textContent = Math.floor(warehouse.amount);

      document.getElementById("courier-count").textContent = couriers.count;
      document.getElementById("courier-level").textContent = couriers.level;
      document.getElementById("courier-cost").textContent = courierUpgradeCost();

      document.getElementById("elev-level").textContent = elevator.level;
      document.getElementById("elev-load").textContent = `${elevator.currentLoad}/${elevCapacity()}`;
      document.getElementById("elev-cost").textContent = elevUpgradeCost();

      const cabin = document.getElementById("elevator-cabin");
      const shaft = document.getElementById("elevator-shaft");
      const maxPos = shaft.clientHeight - 34;
      cabin.style.top = `${(elevator.position / 3) * maxPos}px`;
      cabin.textContent = elevator.currentLoad;

      floors.forEach(f => {
        const el = document.getElementById(`floor-${f.id}`);
        el.querySelector(".lvl").textContent = f.level;
        el.querySelector(".box-count").textContent = Math.floor(f.current);
        el.querySelector(".box-fill").style.width = `${(f.current / f.boxCap) * 100}%`;
        el.querySelector(".cost").textContent = floorUpgradeCost(f);

        const plantsEl = el.querySelector(".plants");
        const maxPlants = 8;
        const visible = Math.min(maxPlants, Math.ceil((f.current / f.boxCap) * maxPlants) + 1);
        if (plantsEl.children.length !== visible) {
          plantsEl.innerHTML = "";
          for (let i = 0; i < visible; i++) {
            const p = document.createElement("div");
            p.className = "plant";
            plantsEl.appendChild(p);
          }
        }
      });
    }

    // ===================== КНОПКИ =====================
    document.getElementById("upgrade-elev").onclick = () => {
      const cost = elevUpgradeCost();
      if (player.coins >= cost) {
        player.coins -= cost;
        elevator.level++;
        haptic('success');
        save();
        render();
      } else {
        haptic('error');
      }
    };

    document.getElementById("upgrade-courier").onclick = () => {
      const cost = courierUpgradeCost();
      if (player.coins >= cost) {
        player.coins -= cost;
        couriers.level++;
        if (couriers.level % 2 === 0) couriers.count++;
        haptic('success');
        save();
        render();
      } else {
        haptic('error');
      }
    };

    document.querySelectorAll("#floors button").forEach(btn => {
      btn.onclick = () => {
        const id = +btn.dataset.floor;
        const f = floors.find(fl => fl.id === id);
        const cost = floorUpgradeCost(f);
        if (player.coins >= cost) {
          player.coins -= cost;
          f.level++;
          f.boxCap = Math.floor(20 * (1 + f.level * 0.28));
          haptic('success');
          save();
          render();
        } else {
          haptic('error');
        }
      };
    });

    document.getElementById("collect-offline").onclick = () => {
      document.getElementById("offline-popup").classList.remove("show");
      haptic('success');
    };

    // ===================== ЗАПУСК =====================
    let lastTick = Date.now();

    function gameLoop(now) {
      const delta = (now - lastTick) / 1000;
      lastTick = now;

      produce(delta);
      updateElevator(now);
      updateCouriers(now);
      render();

      requestAnimationFrame(gameLoop);
    }

    load();

    const offlineEarned = calculateOffline();
    if (offlineEarned > 0) {
      player.coins += offlineEarned;
      document.getElementById("offline-coins").textContent = offlineEarned.toLocaleString("ru");
      document.getElementById("offline-popup").classList.add("show");
    }

    player.lastSaveTime = Date.now();
    save();
    render();
    requestAnimationFrame(gameLoop);
    setInterval(save, 12000);
  </script>
</body>
</html>
